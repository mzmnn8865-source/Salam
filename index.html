<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پیام گیمفا</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Tahoma, Vazirmatn, Arial, sans-serif;
      background: #121212;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
    }

    .message {
      background: linear-gradient(135deg, #1e1e1e, #2a2a2a);
      border: 1px solid #3a3a3a;
      border-radius: 16px;
      padding: 24px 32px;
      font-size: 20px;
      font-weight: bold;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      line-height: 1.8;
    }

    @media (max-width: 480px) {
      .message {
        font-size: 16px;
        padding: 18px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="message">
    سلام من هوش‌مصنوعی گیمفا هستم
  </div>
</body>
</html>
